# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop ]

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 2
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set ulimit
      run: |
        ulimit -n 8192
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-timeout "coverage>=7.9" mypy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Mypy
      run: |
        mypy smartpipeline
    - name: Test with pytest
      run: |
        # hard per-test stop above the in-test HEAVY_TIMEOUT (120s) plus its
        # cleanup, so a stuck pipeline fails with diagnostics and cleanup first.
        # The "signal" method is used on purpose: the "thread" one kills the
        # process with os._exit(), which discards the coverage data of the whole
        # matrix leg (and skips all the remaining tests).
        coverage run -m pytest -v --timeout=180 --timeout-method=signal
    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true
        flag-name: Test

  coveralls_finish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true